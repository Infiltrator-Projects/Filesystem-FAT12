name: Qualify native FAT12.so FUSE/VFS host
on:
  push:
    branches: [main]
    paths:
      - 'native/host/filesystem_fuse_host.c'
      - '.github/workflows/fuse-host.yml'
      - 'native/filesystems/fat/portable/**'
      - 'native/filesystems/fat/module/**'
      - 'standalone/build.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fuse-host:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Native C build and independent validation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config libfuse3-dev fuse3 dosfstools mtools
      - name: Qualify authoritative SO
        run: make check
      - name: Compile native VFS host
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror \
            -I src/infiltratr-common/include native/host/filesystem_fuse_host.c \
            $(pkg-config --cflags --libs fuse3) -ldl -o build/ifs-fuse-host
          build/ifs-fuse-host --help
      - name: Check callbacks and independently verify FAT allocation integrity
        run: |
          set -euo pipefail
          for bytes in 1474560 267386880; do
            image="$RUNNER_TEMP/fuse-$bytes.img"
            truncate -s "$bytes" "$image"
            build/ifs-fuse-host --self-test "$PWD/build/FAT12.so" "$image"
            fsck.fat -n -v "$image"
            mdir -i "$image" ::
          done
      - name: Attempt actual kernel FUSE mount when the runner exposes /dev/fuse
        shell: bash
        run: |
          set -euo pipefail
          test -c /dev/fuse || { echo "Required kernel FUSE device is unavailable" >&2; exit 1; }
          work="$RUNNER_TEMP/ifs-fuse-live"
          mkdir -p "$work/mount"
          truncate -s 8388608 "$work/volume.img"
          build/ifs-fuse-host --self-test "$PWD/build/FAT12.so" "$work/volume.img"
          build/ifs-fuse-host --mount-rw-image "$PWD/build/FAT12.so" "$work/volume.img" "$work/mount" &
          host_pid=$!
          cleanup() {
            if mountpoint -q "$work/mount"; then fusermount3 -u "$work/mount" || true; fi
            kill "$host_pid" 2>/dev/null || true
            wait "$host_pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          ready=0
          for i in $(seq 1 50); do
            if mountpoint -q "$work/mount"; then ready=1; break; fi
            if ! kill -0 "$host_pid" 2>/dev/null; then break; fi
            sleep 0.2
          done
          test "$ready" -eq 1
          printf 'FAT12 via canonical SO and Linux VFS\n' > "$work/mount/canonical.txt"
          cmp <(printf 'FAT12 via canonical SO and Linux VFS\n') "$work/mount/canonical.txt"
          mv "$work/mount/canonical.txt" "$work/mount/renamed.txt"
          truncate -s 9 "$work/mount/renamed.txt"
          test "$(wc -c < "$work/mount/renamed.txt")" -eq 9
          rm "$work/mount/renamed.txt"
          sync
          fusermount3 -u "$work/mount"
          wait "$host_pid"
          trap - EXIT
          fsck.fat -n "$work/volume.img"
          echo "KERNEL-FUSE-MOUNT-READ-WRITE-PASS"
      - name: Verify read-only Linux kernel mount denies all mutations
        shell: bash
        run: |
          set -euo pipefail
          test -c /dev/fuse
          work="$RUNNER_TEMP/ifs-fuse-readonly"
          mkdir -p "$work/mount"
          truncate -s 8388608 "$work/volume.img"
          build/ifs-fuse-host --self-test "$PWD/build/FAT12.so" "$work/volume.img"
          build/ifs-fuse-host --mount-ro-image "$PWD/build/FAT12.so" "$work/volume.img" "$work/mount" &
          host_pid=$!
          cleanup() {
            if mountpoint -q "$work/mount"; then fusermount3 -u "$work/mount" || true; fi
            kill "$host_pid" 2>/dev/null || true
            wait "$host_pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          ready=0
          for i in $(seq 1 50); do
            if mountpoint -q "$work/mount"; then ready=1; break; fi
            if ! kill -0 "$host_pid" 2>/dev/null; then break; fi
            sleep 0.2
          done
          test "$ready" -eq 1
          test -d "$work/mount"
          if printf 'must be refused\n' > "$work/mount/NO_WRITE.TXT"; then
            echo "Read-only FAT12 mount accepted a write!" >&2
            exit 1
          fi
          test ! -e "$work/mount/NO_WRITE.TXT"
          fusermount3 -u "$work/mount"
          wait "$host_pid"
          trap - EXIT
          fsck.fat -n "$work/volume.img"
          echo "KERNEL-FUSE-READONLY-ENFORCEMENT-PASS"
      - name: Verify two simultaneous kernel mounts use separate SO sessions
        shell: bash
        run: |
          set -euo pipefail
          test -c /dev/fuse || { echo "Required two-volume kernel FUSE device is unavailable" >&2; exit 1; }
          work="$RUNNER_TEMP/ifs-fuse-two"
          mkdir -p "$work/a" "$work/b"
          truncate -s 1474560 "$work/a.img"
          truncate -s 8388608 "$work/b.img"
          build/ifs-fuse-host --self-test "$PWD/build/FAT12.so" "$work/a.img"
          build/ifs-fuse-host --self-test "$PWD/build/FAT12.so" "$work/b.img"
          build/ifs-fuse-host --mount-rw-image "$PWD/build/FAT12.so" "$work/a.img" "$work/a" &
          a_pid=$!
          build/ifs-fuse-host --mount-rw-image "$PWD/build/FAT12.so" "$work/b.img" "$work/b" &
          b_pid=$!
          cleanup() {
            for mount in "$work/a" "$work/b"; do
              if mountpoint -q "$mount"; then fusermount3 -u "$mount" || true; fi
            done
            kill "$a_pid" "$b_pid" 2>/dev/null || true
            wait "$a_pid" 2>/dev/null || true
            wait "$b_pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          ready=0
          for i in $(seq 1 50); do
            if mountpoint -q "$work/a" && mountpoint -q "$work/b"; then
              ready=1; break
            fi
            if ! kill -0 "$a_pid" 2>/dev/null || ! kill -0 "$b_pid" 2>/dev/null; then break; fi
            sleep 0.2
          done
          test "$ready" -eq 1
          printf 'volume A only\n' > "$work/a/FIRST.TXT"
          printf 'volume B only\n' > "$work/b/SECOND.TXT"
          test ! -e "$work/a/SECOND.TXT"
          test ! -e "$work/b/FIRST.TXT"
          cmp <(printf 'volume A only\n') "$work/a/FIRST.TXT"
          cmp <(printf 'volume B only\n') "$work/b/SECOND.TXT"
          sync
          fusermount3 -u "$work/a"
          fusermount3 -u "$work/b"
          wait "$a_pid"
          wait "$b_pid"
          trap - EXIT
          fsck.fat -n "$work/a.img"
          fsck.fat -n "$work/b.img"
          echo "TWO-VOLUME-KERNEL-FUSE-SO-ISOLATION-PASS"
      - name: Record qualification boundary
        run: |
          echo "Canonical .so and FUSE operation callbacks validated on disposable images."
          echo "Actual kernel FUSE read/write, read-only and two-volume mounts are required by this workflow."
          echo "Direct kernel ELF .so execution, physical block writes, multi-user and power-loss recovery are still unqualified."
