name: Qualify and publish independent FAT12 module
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: filesystem-fat12-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}
jobs:
  no-fuse:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Reject prohibited FUSE before installing any build dependencies
        run: bash tests/no-fuse.sh
  qualify:
    needs: no-fuse
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install build and inspection prerequisites
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential binutils python3 dpkg-dev
      - name: Compile and exercise exactly one shared object
        run: make check
      - name: Compile the GitHub source archive against the canonical Common revision
        run: bash tests/common-source.sh
      - name: Build the DEB and native source installer
        run: |
          make release
          bootstrap="$(find dist -maxdepth 1 -type f -name '*.run' -print -quit)"
          test -s "$bootstrap"
          test "$(wc -c < "$bootstrap")" -lt 8192
          if grep -aF '__IFS_SOURCE_PAYLOAD_BELOW__' "$bootstrap"; then exit 1; fi
          grep -F "$GITHUB_SHA" "$bootstrap"
      - name: Validate release bytes and native installation
        shell: bash
        run: |
          set -euo pipefail
          test "$(find dist -maxdepth 1 -type f | wc -l)" -eq 2
          dpkg-deb --info dist/*.deb
          sudo python3 standalone/check-documentation-upgrade.py dist/*.deb
          dpkg-deb --contents dist/*.deb
          bash dist/*.run --help
          sudo bash dist/*.run --profile aggressive
          version=$(cat VERSION)
          test "$(dpkg-query -W -f='${Version}' infiltrator-filesystem-fat12)" = "${version}+native1"
          python3 standalone/build.py --profile portable --output build/FAT12.so --check
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          lib = Path("/System/Filesystems/FAT12.so")
          import os
          import subprocess
          docs = Path("/System/Resources/Documentation")
          manual = docs / "Filesystem-FAT12.pdf"
          assert manual.read_bytes().startswith(b"%PDF-")
          assert manual.is_file() and not manual.is_symlink()
          report = subprocess.check_output(["dpkg-query", "-s", "infiltrator-filesystem-fat12"], text=True)
          fields = dict(line.split(": ", 1) for line in report.splitlines() if ": " in line)
          assert fields["X-Infiltrator-Native-Profile"] == "aggressive"
          assert fields["X-Infiltrator-PGO"] == "trained-two-pass"
          assert fields["X-Infiltrator-LTO"] == "enabled"
          assert fields["X-Infiltrator-Source-Revision"] == os.environ["GITHUB_SHA"]
          assert "-O3 -march=native -mtune=native -flto=auto" in fields["X-Infiltrator-Cflags"]
          assert fields["X-Infiltrator-Resource-SHA256"] == hashlib.sha256(lib.read_bytes()).hexdigest()
          assert fields["X-Infiltrator-PDF-SHA256"] == hashlib.sha256(manual.read_bytes()).hexdigest()
          assert not Path("/System/Filesystems/FAT16.so").exists()
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: fat12-qualified-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
  manual-package:
    needs: qualify
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: fat12-qualified-${{ github.sha }}
          path: dist
      - name: Build the normal FAT12 native RUN without a kernel adapter
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential binutils cmake git pkg-config libssl-dev libsqlite3-dev dpkg-dev dosfstools mtools
          bash dist/*.run --profile portable --build-only --output "$RUNNER_TEMP/manual"
          python3 standalone/check-package.py "$RUNNER_TEMP"/manual/*.deb --profile portable
          mkdir -p "$RUNNER_TEMP/manual-root" "$RUNNER_TEMP/portable-root"
          dpkg-deb -x dist/*.deb "$RUNNER_TEMP/portable-root"
          dpkg-deb -x "$RUNNER_TEMP"/manual/*.deb "$RUNNER_TEMP/manual-root"
          for root in "$RUNNER_TEMP/portable-root" "$RUNNER_TEMP/manual-root"; do
            test "$(find "$root" -type f | wc -l)" -eq 2
            test -s "$root/System/Filesystems/FAT12.so"
            nm -D --defined-only "$root/System/Filesystems/FAT12.so" | grep -F infiltrator_filesystem_api_v2
            test "$(find "$root" -name '*.ko' -o -name '*.efi' | wc -l)" -eq 0
          done
          cmp "$RUNNER_TEMP/manual-root/System/Resources/Documentation/Filesystem-FAT12.pdf" \
              "$RUNNER_TEMP/portable-root/System/Resources/Documentation/Filesystem-FAT12.pdf"
  publish:
    needs: [qualify, manual-package]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: fat12-qualified-${{ github.sha }}
          path: dist
      - name: Publish qualified Common V2 SO and native installer only
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$(git ls-remote origin refs/heads/main | cut -f1)"
          version=$(cat VERSION)
          tag="v${version}"
          test "$(find dist -maxdepth 1 -type f -name '*.deb' | wc -l)" -eq 1
          test "$(find dist -maxdepth 1 -type f -name '*.run' | wc -l)" -eq 1
          test "$(find dist -type f | wc -l)" -eq 2
          test "$(find dist -name '*.ko' -o -name '*.efi' | wc -l)" -eq 0
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Immutable $tag exists; no release update required."
            exit 0
          fi
          sha256sum dist/*.deb dist/*.run
          gh release create "$tag" dist/*.deb dist/*.run \
            --target "$GITHUB_SHA" --title "Filesystem FAT12 ${version}" \
            --notes "One canonical Common V2 FAT12.so and source-first native installer. No filesystem-specific kernel module or independent EFI driver. Common V2 filesystem operations, freestanding firmware profile, native and portable package qualification passed."
