name: Qualify and publish independent FAT12 module
on:
  push:
    branches: [main, migration/full-source-fat12-20261028]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: filesystem-fat12-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install build and inspection prerequisites
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential binutils python3 dpkg-dev
      - name: Compile and exercise exactly one shared object
        run: make check
      - name: Build the DEB and native source installer
        run: make release
      - name: Validate release bytes and native installation
        shell: bash
        run: |
          set -euo pipefail
          test "$(find dist -maxdepth 1 -type f | wc -l)" -eq 2
          dpkg-deb --info dist/*.deb
          dpkg-deb --contents dist/*.deb
          bash dist/*.run --help
          sudo bash dist/*.run --profile aggressive --system-package-mode
          version=$(cat VERSION)
          test "$(dpkg-query -W -f='${Version}' infiltrator-filesystem-fat12)" = "${version}+native1"
          python3 standalone/build.py --profile portable --output build/FAT12.so --check
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          lib = Path("/System/Filesystems/FAT12.so")
          import os
          import subprocess
          docs = Path("/System/Resources/Documentation/Filesystem-FAT12")
          manual = docs / "FAT12.pdf"
          assert manual.read_bytes().startswith(b"%PDF-")
          assert {p.name for p in docs.iterdir()} == {manual.name}
          report = subprocess.check_output(["dpkg-query", "-s", "infiltrator-filesystem-fat12"], text=True)
          fields = dict(line.split(": ", 1) for line in report.splitlines() if ": " in line)
          assert fields["X-Infiltrator-Native-Profile"] == "aggressive"
          assert fields["X-Infiltrator-PGO"] == "trained-two-pass"
          assert fields["X-Infiltrator-LTO"] == "enabled"
          assert fields["X-Infiltrator-Source-Revision"] == os.environ["GITHUB_SHA"]
          assert "-O3 -march=native -mtune=native -flto=auto" in fields["X-Infiltrator-Cflags"]
          assert fields["X-Infiltrator-Resource-SHA256"] == hashlib.sha256(lib.read_bytes()).hexdigest()
          assert fields["X-Infiltrator-PDF-SHA256"] == hashlib.sha256(manual.read_bytes()).hexdigest()
          assert not Path("/System/Filesystems/FAT16.so").exists()
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: fat12-qualified-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
  boot-consumer:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Check out immutable released Boot consumer
        uses: actions/checkout@v4
        with:
          repository: Infiltrator-Projects/Boot
          ref: dbc6a710dbe88b78318c8b9afbf47bb64e8706b3
          path: .qualification/Boot
      - name: Install generic ELF and actual firmware qualification tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential binutils python3 gnu-efi qemu-system-x86 ovmf dosfstools mtools busybox-static cpio
      - name: Qualify the exact FAT12.so with the unmodified Boot implementation
        shell: bash
        run: |
          set -euo pipefail
          root="$GITHUB_WORKSPACE"
          boot="$root/.qualification/Boot"
          make check
          python3 standalone/build.py --profile aggressive --output build-native/FAT12.so --check
          # Only the FAT16-specific test fixtures are adapted; production Boot stays unchanged.
          python3 - "$boot" <<'PY'
          from pathlib import Path
          import sys
          boot=Path(sys.argv[1])
          p=boot/'tests/run-so-tests.sh'
          s=p.read_text().replace('FAT16', 'FAT12').replace('fat16', 'fat12')
          s=s.replace('mkfs.fat -F 16 ', 'mkfs.fat -F 12 -s 32 ')
          p.write_text(s)
          p=boot/'tests/so_module_test.c'
          p.write_text(p.read_text().replace('"fat16"', '"fat12"'))
          p=boot/'tests/test_so_boot.py'
          s=p.read_text().replace('FAT16', 'FAT12').replace('fat16', 'fat12')
          s=s.replace('"mkfs.fat", "-F", "16", "-I"', '"mkfs.fat", "-F", "12", "-s", "64", "-I"')
          p.write_text(s)
          PY
          cd "$boot"
          bash scripts/build-gnuefi.sh
          cd "$root"
          for profile in build build-native; do
            bash "$boot/tests/run-so-tests.sh" "$root/$profile/FAT12.so" "$root"
          done
          IFS_SO_SANITIZE=1 bash "$boot/tests/run-so-tests.sh" "$root/build/FAT12.so" "$root"
          mkdir -p build/boot-kernel
          package=$(apt-cache depends linux-image-generic | awk '/Depends: linux-image-[0-9]/ {sub("linux-image-", "linux-image-unsigned-", $2); print $2; exit}')
          test -n "$package"
          (cd build/boot-kernel && apt-get download "$package")
          dpkg-deb -x build/boot-kernel/*.deb build/boot-kernel/root
          kernel=$(find "$root/build/boot-kernel/root/boot" -name 'vmlinuz-*' -print -quit)
          test -s "$kernel"
          for profile in build build-native; do
            python3 "$boot/tests/test_so_boot.py" --boot "$boot/refind/refind_x64.efi" \
              --module "$root/$profile/FAT12.so" --kernel "$kernel" \
              --output "$root/build/boot-$profile"
          done
          python3 "$boot/tests/test_so_boot.py" --boot "$boot/refind/refind_x64.efi" \
            --module "$root/build/FAT12.so" --kernel "$kernel" --reject-module \
            --output "$root/build/boot-reject"
  native-drivers:
    uses: ./.github/workflows/drivers.yml
  publish:
    needs: [qualify, boot-consumer, native-drivers]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: fat12-qualified-${{ github.sha }}
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: fat12-fat16-efi-experimental
          path: build/native
      - uses: actions/download-artifact@v4
        with:
          name: fat12-fat16-ko-6.12.107-qemu-only
          path: build/native
      - name: Publish exact qualified release once
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$(git ls-remote origin refs/heads/main | cut -f1)"
          version=$(cat VERSION)
          tag="v${version}"
          test -s build/native/FAT12.efi
          test -s build/native/fat12.ko
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Immutable $tag already exists; no release update required."
            exit 0
          fi
          install -m 0644 "build/native/FAT12.efi" "dist/FAT12.efi"
          install -m 0644 "build/native/fat12.ko" "dist/fat12-linux-6.12.107.ko"
          sha256sum dist/*.deb dist/*.run dist/*.efi dist/*.ko
          gh release create "$tag" dist/*.deb dist/*.run dist/*.efi dist/*.ko \
            --target "$GITHUB_SHA" --title "Filesystem FAT12 ${version}" \
            --notes "Independent FAT12.so portable package and source-first native RUN; FAT12.efi is independently OVMF-tested for x86-64 boot services; fat12-linux-6.12.107.ko is QEMU-tested for ONLY that pinned Linux 6.12.107 kernel and compatible FAT core, and must be rebuilt for any other host kernel. Physical-drive safety, arbitrary-root boot, and generic signed kernel installation are NOT certified."
